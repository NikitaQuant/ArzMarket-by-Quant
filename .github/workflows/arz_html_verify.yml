name: ArzMarket HTML verification

on:
  push:
    branches:
      - feature/html-cef-block1

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/html-cef-block1
      - name: Check JavaScript syntax
        run: node --check ArzMarket/html/js/app.js
      - name: Check HTML and bridge contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path('ArzMarket/html/index.html').read_text(encoding='utf-8')
          js=Path('ArzMarket/html/js/app.js').read_text(encoding='utf-8')
          lua=Path('modules/arz_html_ui.lua').read_text(encoding='utf-8')
          main=Path('by_Quant_ArzMarket[3_56].lua').read_text(encoding='utf-8')
          ids=['configSelect','scanButton','currencyButton','refreshButton','pricesButton','averageButton','startButton']
          for ident in ids:
              assert html.count(f'id="{ident}"') == 1, ident
          actions=['trade.config.load','trade.currency.toggle','trade.scan.toggle','buy.source.refresh','prices.download','buy.average.apply','trade.start']
          for action in actions:
              assert action in js and action in lua, action
          contexts=['listTradeConfigs','loadTradeConfig','getTradeUiState','toggleTradeCurrency','toggleTradeScan','refreshBuySource','downloadAveragePrices']
          for name in contexts:
              assert f'ctx.{name}' in main, name
          assert '(24|48|256)' not in lua
          assert '^/api/icon/(%d+)/(%d+)%.webp$' in lua
          PY
