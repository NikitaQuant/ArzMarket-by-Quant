name: ArzMarket HTML buy budget patch

on:
  push:
    branches:
      - feature/html-cef-block1
    paths:
      - .github/patch_html_buy_budget.py
      - .github/workflows/arz_html_buy_budget.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/html-cef-block1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply patch
        run: python .github/patch_html_buy_budget.py
      - name: Verify JavaScript
        run: node --check ArzMarket/html/js/app.js
      - name: Verify contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          main=Path('by_Quant_ArzMarket[3_56].lua').read_text(encoding='utf-8')
          bridge=Path('modules/arz_html_ui.lua').read_text(encoding='utf-8')
          html=Path('ArzMarket/html/index.html').read_text(encoding='utf-8')
          js=Path('ArzMarket/html/js/app.js').read_text(encoding='utf-8')
          css=Path('ArzMarket/html/css/style.css').read_text(encoding='utf-8')
          assert 'ctx.previewBuyBudget = function(totalBudget)' in main
          assert 'ctx.distributeBuyBudget = function(totalBudget)' in main
          assert 'module_version = 13' in bridge
          assert 'action=="buy.budget.preview"' in bridge
          assert 'action=="buy.budget.apply"' in bridge
          assert 'id="budgetButton"' in html and 'id="budgetBackdrop"' in html
          assert 'refreshBudgetPreview' in js and "action('buy.budget.apply'" in js
          assert '.budget-summary' in css
          PY
      - name: Commit patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'by_Quant_ArzMarket[3_56].lua' modules/arz_html_ui.lua ArzMarket/html/index.html ArzMarket/html/css/style.css ArzMarket/html/js/app.js
          git diff --cached --quiet && exit 0
          git commit -m "Add HTML buy budget distribution"
          git push origin HEAD:feature/html-cef-block1
