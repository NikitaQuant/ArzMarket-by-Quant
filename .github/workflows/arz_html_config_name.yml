name: ArzMarket HTML config name fix

on:
  push:
    branches:
      - feature/html-cef-block1

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/html-cef-block1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python .github/patch_html_config_name.py
      - name: Check
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('by_Quant_ArzMarket[3_56].lua').read_text(encoding='utf-8')
          assert 'if fileName ~= "" and not fileName:match("%.json$") then fileName = fileName .. ".json" end' in s
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'by_Quant_ArzMarket[3_56].lua'
          git diff --cached --quiet && exit 0
          git commit -m "Accept HTML config names without extension"
          git push origin HEAD:feature/html-cef-block1
