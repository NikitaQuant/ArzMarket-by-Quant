name: ArzMarket HTML list management patch

on:
  push:
    branches:
      - feature/html-cef-block1
    paths:
      - .github/patch_html_list_management.py
      - .github/workflows/arz_html_list_management.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/html-cef-block1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply patch
        run: python .github/patch_html_list_management.py
      - name: Verify JavaScript
        run: node --check ArzMarket/html/js/app.js
      - name: Verify contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          main = Path('by_Quant_ArzMarket[3_56].lua').read_text(encoding='utf-8')
          bridge = Path('modules/arz_html_ui.lua').read_text(encoding='utf-8')
          html = Path('ArzMarket/html/index.html').read_text(encoding='utf-8')
          js = Path('ArzMarket/html/js/app.js').read_text(encoding='utf-8')
          css = Path('ArzMarket/html/css/style.css').read_text(encoding='utf-8')
          for marker in [
              'ctx.getTradeUndoCount = function(side)',
              'ctx.deleteTradeItem = function(side, index)',
              'ctx.clearTradeList = function(side)',
              'ctx.undoTradeDelete = function(side)',
              'ctx.getBuyContinueMode = function()',
              'ctx.setBuyContinueMode = function(value)'
          ]:
              assert marker in main, marker
          assert 'module_version = 11' in bridge
          assert 'action=="trade.list.clear"' in bridge
          assert 'action=="trade.item.undo"' in bridge
          assert 'action=="buy.continue.toggle"' in bridge
          assert 'count_maximum or ""' in bridge
          assert 'id="undoButton"' in html
          assert 'id="clearButton"' in html
          assert 'id="continueButton"' in html
          assert "refs.undoButton.addEventListener('click'" in js
          assert "refs.clearButton.addEventListener('click'" in js
          assert "refs.continueButton.addEventListener('click'" in js
          assert "String(event.key).toLowerCase() === 'z'" in js
          assert 'btn-destructive' in css
          PY
      - name: Commit patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'by_Quant_ArzMarket[3_56].lua' modules/arz_html_ui.lua ArzMarket/html/index.html ArzMarket/html/css/style.css ArzMarket/html/js/app.js
          git diff --cached --quiet && exit 0
          git commit -m "Add HTML list management and buy continuation"
          git push origin HEAD:feature/html-cef-block1
