name: Patch ArzMarket component manifest URL

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[manifest url patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch manifest URL
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('by_Quant_ArzMarket[3_56].lua')
          s = p.read_text(encoding='utf-8')
          old = '__ARZMARKET_COMPONENTS_MANIFEST_RAW_URL__'
          new = 'https://raw.githubusercontent.com/NikitaQuant/ArzMarket-by-Quant/main/components_manifest.json'
          count = s.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one placeholder, found {count}')
          p.write_text(s.replace(old, new), encoding='utf-8', newline='')
          PY

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/patch-component-manifest-url.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Configure ArzMarket component manifest URL [manifest url patched]"
          git push origin HEAD:main
