name: ArzMarket HTML icon route patch

on:
  push:
    branches:
      - feature/html-cef-block1

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/html-cef-block1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply patch
        run: python .github/patch_html_icon_route.py
      - name: Static checks
        run: |
          python - <<'PY'
          from pathlib import Path
          lua = Path('modules/arz_html_ui.lua').read_text(encoding='utf-8')
          js = Path('ArzMarket/html/js/app.js').read_text(encoding='utf-8')
          assert 'local size,id=req.path:match("^/api/icon/(%d+)/(%d+)%.webp$")' in lua
          assert '(24|48|256)' not in lua
          assert 'private, max-age=86400' in lua
          assert "action('ui.close', {side: state.page})" in js
          PY
      - name: Commit patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modules/arz_html_ui.lua ArzMarket/html/js/app.js
          git diff --cached --quiet && exit 0
          git commit -m "Fix HTML item icon route and Escape handling"
          git push origin HEAD:feature/html-cef-block1
