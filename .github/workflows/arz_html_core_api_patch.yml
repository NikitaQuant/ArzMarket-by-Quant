name: ArzMarket HTML core API patch

on:
  push:
    branches:
      - tmp-html-core-patch
    paths:
      - .github/workflows/arz_html_core_api_patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-html-core-patch
          fetch-depth: 0

      - name: Patch explicit HTML core APIs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          main_path = Path("by_Quant_ArzMarket[3_56].lua")
          bridge_path = Path("modules/arz_html_ui.lua")

          main_text = main_path.read_text(encoding="utf-8")
          bridge_text = bridge_path.read_text(encoding="utf-8")

          main_marker = "\treturn ctx\nend\n\nfunction arzUiExtensionsEnsureDirectory()"
          if main_text.count(main_marker) != 1:
              raise SystemExit("core context marker not found exactly once")

          core_api = '''\tctx.getTradeAutomationState = function()
\t\treturn {
\t\t\tsell = tradeAutomation.sell == true,
\t\t\tbuy = tradeAutomation.buy == true,
\t\t\tscore = tonumber(tradeAutomation.score) or 0,
\t\t\tscore_from = tonumber(tradeAutomation.score_from) or 0
\t\t}
\tend
\tctx.getCoreMenuVisible = function()
\t\treturn menuVisible and menuVisible[0] == true or false
\tend
\tctx.setCoreMenuVisible = function(value)
\t\tlocal nextValue = value == true
\t\tmenuOpen = nextValue
\t\tif menuVisible then
\t\t\tmenuVisible[0] = nextValue
\t\tend
\t\tif nextValue then
\t\t\tkifir = 1
\t\t\tonOpenMenu = true
\t\t\tzzztime = os.clock()
\t\telseif type(resetIO) == "function" then
\t\t\tpcall(resetIO)
\t\tend
\t\treturn true
\tend
\tctx.startTrade = function(side)
\t\tif type(sampProcessChatInput) ~= "function" then return false end
\t\tside = side == "sell" and "sell" or "buy"
\t\tsampProcessChatInput(side == "sell" and "/crsell" or "/crbuy")
\t\treturn true
\tend
\tctx.cancelTrade = function()
\t\tif type(off_sell_buy) ~= "function" then return false end
\t\toff_sell_buy()
\t\treturn true
\tend
'''
          main_text = main_text.replace(main_marker, core_api + main_marker, 1)

          old_bridge = '''local function findUpvalue(fn,wanted)
    if type(fn)~="function" or type(debug)~="table" or type(debug.getupvalue)~="function" then return nil,nil end
    for i=1,128 do
        local name,value=debug.getupvalue(fn,i)
        if not name then break end
        if name==wanted then return i,value end
    end
end
local function tradeState()
    if type(off_sell_buy)~="function" then return nil end
    local _,value=findUpvalue(off_sell_buy,"tradeAutomation")
    return type(value)=="table" and value or nil
end
local function automationState(side)
    local state=tradeState()
    if not state then return false,0,0 end
    return state[side]==true,saneNumber(state.score,0) or 0,saneNumber(state.score_from,0) or 0
end
local function setMenuVisible(value)
    local probe=type(modificationState)=="table" and modificationState.updateMenuMouseNavigation or nil
    if type(probe)~="function" then return false end
    local _,flag=findUpvalue(probe,"menuVisible")
    if type(flag)~="table" and type(flag)~="cdata" then return false end
    return pcall(function() flag[0]=value==true end)
end
'''
          new_bridge = '''local function automationState(side)
    if not ctx or type(ctx.getTradeAutomationState)~="function" then return false,0,0 end
    local ok,state=pcall(ctx.getTradeAutomationState)
    if not ok or type(state)~="table" then return false,0,0 end
    return state[side]==true,saneNumber(state.score,0) or 0,saneNumber(state.score_from,0) or 0
end
local function setMenuVisible(value)
    if not ctx or type(ctx.setCoreMenuVisible)~="function" then return false end
    local ok,result=pcall(ctx.setCoreMenuVisible,value==true)
    return ok and result~=false
end
'''
          if bridge_text.count(old_bridge) != 1:
              raise SystemExit("legacy debug bridge block not found exactly once")
          bridge_text = bridge_text.replace(old_bridge, new_bridge, 1)
          bridge_text = bridge_text.replace("module_version = 3,", "module_version = 4,", 1)

          old_start = '''    elseif action=="trade.start" then
        local active=select(1,automationState(side))
        if active and type(off_sell_buy)=="function" then
            local ok,err=pcall(off_sell_buy); fingerprints[side]=""
            return jsonResponse(ok and 200 or 400,{ok=ok,cancelled=ok,error=ok and nil or tostring(err)})
        end
        if type(sampProcessChatInput)~="function" then return jsonResponse(400,{ok=false,error="chat_input_unavailable"}) end
        local ok,err=pcall(sampProcessChatInput,side=="sell" and "/crsell" or "/crbuy")
        return jsonResponse(ok and 200 or 400,{ok=ok,error=ok and nil or tostring(err)})
'''
          new_start = '''    elseif action=="trade.start" then
        local active=select(1,automationState(side))
        if active then
            if not ctx or type(ctx.cancelTrade)~="function" then return jsonResponse(400,{ok=false,error="cancel_unavailable"}) end
            local ok,result=pcall(ctx.cancelTrade); fingerprints[side]=""
            local success=ok and result~=false
            return jsonResponse(success and 200 or 400,{ok=success,cancelled=success,error=success and nil or tostring(result)})
        end
        if not ctx or type(ctx.startTrade)~="function" then return jsonResponse(400,{ok=false,error="start_unavailable"}) end
        local ok,result=pcall(ctx.startTrade,side)
        local success=ok and result~=false
        return jsonResponse(success and 200 or 400,{ok=success,error=success and nil or tostring(result)})
'''
          if bridge_text.count(old_start) != 1:
              raise SystemExit("trade.start bridge block not found exactly once")
          bridge_text = bridge_text.replace(old_start, new_start, 1)

          if "debug.getupvalue" in bridge_text or "findUpvalue" in bridge_text:
              raise SystemExit("debug upvalue access still present in HTML bridge")

          main_path.write_text(main_text, encoding="utf-8", newline="\n")
          bridge_path.write_text(bridge_text, encoding="utf-8", newline="\n")
          PY

      - name: Verify patch
        shell: bash
        run: |
          grep -q 'ctx.getTradeAutomationState = function()' 'by_Quant_ArzMarket[3_56].lua'
          grep -q 'ctx.setCoreMenuVisible = function(value)' 'by_Quant_ArzMarket[3_56].lua'
          grep -q 'ctx.startTrade = function(side)' 'by_Quant_ArzMarket[3_56].lua'
          grep -q 'ctx.cancelTrade = function()' 'by_Quant_ArzMarket[3_56].lua'
          ! grep -q 'debug.getupvalue' modules/arz_html_ui.lua
          ! grep -q 'findUpvalue' modules/arz_html_ui.lua

      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet -- 'by_Quant_ArzMarket[3_56].lua' modules/arz_html_ui.lua; then
            echo 'No patch changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'by_Quant_ArzMarket[3_56].lua' modules/arz_html_ui.lua
          git commit -m 'Replace HTML debug introspection with core APIs'
          git push origin HEAD:tmp-html-core-patch
