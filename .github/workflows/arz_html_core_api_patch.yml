name: ArzMarket HTML core API patch

on:
  push:
    branches:
      - tmp-html-core-patch
    paths:
      - .github/workflows/arz_html_core_api_patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-html-core-patch
          fetch-depth: 0
      - name: Patch explicit HTML core APIs
        run: python3 .github/patch_html_core_api.py
      - name: Verify patch
        run: |
          grep -q 'ctx.getTradeAutomationState = function()' 'by_Quant_ArzMarket[3_56].lua'
          grep -q 'ctx.setCoreMenuVisible = function(value)' 'by_Quant_ArzMarket[3_56].lua'
          grep -q 'ctx.startTrade = function(side)' 'by_Quant_ArzMarket[3_56].lua'
          grep -q 'ctx.cancelTrade = function()' 'by_Quant_ArzMarket[3_56].lua'
          ! grep -q 'debug.getupvalue' modules/arz_html_ui.lua
          ! grep -q 'findUpvalue' modules/arz_html_ui.lua
      - name: Commit patch
        run: |
          if git diff --quiet -- 'by_Quant_ArzMarket[3_56].lua' modules/arz_html_ui.lua; then
            echo 'No patch changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'by_Quant_ArzMarket[3_56].lua' modules/arz_html_ui.lua
          git commit -m 'Replace HTML debug introspection with core APIs'
          git push origin HEAD:tmp-html-core-patch
