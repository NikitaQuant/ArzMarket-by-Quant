name: ArzMarket HTML hardening patch

on:
  push:
    branches:
      - tmp-html-cef-hardening
    paths:
      - .github/workflows/arz_html_hardening.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-html-cef-hardening
          fetch-depth: 0
      - name: Apply hardening patch
        run: python3 .github/patch_html_hardening.py
      - name: Verify JavaScript
        run: node --check ArzMarket/html/js/app.js
      - name: Verify bridge invariants
        run: |
          grep -q 'module_version = 5' modules/arz_html_ui.lua
          grep -q 'tradeBusy=busy' modules/arz_html_ui.lua
          grep -q 'other_trade_active' modules/arz_html_ui.lua
          ! grep -q 'file:///arizona/items.zip' ArzMarket/html/js/app.js
          ! grep -q 'frame-ancestors' modules/arz_html_ui.lua
      - name: Commit hardening
        run: |
          if git diff --quiet -- modules/arz_html_ui.lua ArzMarket/html/js/app.js; then
            echo 'No hardening changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- modules/arz_html_ui.lua ArzMarket/html/js/app.js
          git commit -m 'Harden HTML bridge runtime state and icon loading'
          git push origin HEAD:tmp-html-cef-hardening
