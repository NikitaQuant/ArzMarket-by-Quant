name: ArzMarket HTML add defaults patch

on:
  push:
    branches:
      - feature/html-cef-block1
    paths:
      - .github/patch_html_add_defaults.py
      - .github/workflows/arz_html_add_defaults.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/html-cef-block1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply patch
        run: python .github/patch_html_add_defaults.py
      - name: Verify JavaScript
        run: node --check ArzMarket/html/js/app.js
      - name: Verify contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          main=Path('by_Quant_ArzMarket[3_56].lua').read_text(encoding='utf-8')
          bridge=Path('modules/arz_html_ui.lua').read_text(encoding='utf-8')
          js=Path('ArzMarket/html/js/app.js').read_text(encoding='utf-8')
          assert 'ctx.getTradeAddDefaults = function(side)' in main
          assert 'module_version = 12' in bridge
          assert 'defaults.sort_mode and 1 or nil' in bridge
          assert 'not_enough_items' in bridge
          assert 'defaultPrice' in bridge and 'defaultCount' in bridge
          assert 'Недостаточно предметов' in js
          PY
      - name: Commit patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'by_Quant_ArzMarket[3_56].lua' modules/arz_html_ui.lua ArzMarket/html/js/app.js
          git diff --cached --quiet && exit 0
          git commit -m "Match HTML item add defaults with Lua UI"
          git push origin HEAD:feature/html-cef-block1
